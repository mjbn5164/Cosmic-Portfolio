<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmic Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body, html { margin: 0; padding: 0; height: 100%; width: 100%; background-color: #000; }
      #root { width: 100%; height: 100%; }
      /* Custom scrollbar hiding for immersive feel */
      ::-webkit-scrollbar { width: 0px; background: transparent; }

      /* Container que não se mexe nunca */
      .ui-fixed-container {
        position: fixed;
        top: 40px;
        right: 40px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 99999; /* Garante que fica à frente de tudo */
        pointer-events: none;
      }

      .cosmic-button {
        pointer-events: all;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(15px) saturate(150%);
        -webkit-backdrop-filter: blur(15px) saturate(150%);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50px;
        padding: 12px 25px;
        color: white;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        cursor: pointer;
      }

      .cosmic-button.show {
        opacity: 1;
        transform: translateX(0);
      }

      .cosmic-button.hide {
        opacity: 0;
        transform: translateX(100px);
      }

      .cosmic-button:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.8);
        box-shadow: 0 0 20px var(--glow);
      }
    </style>
